# Source register — pre-filled, tiered knowledge sources.
# Purpose: when agents research, they consult sources in tier order and cite
# which tier answered. Tier 1 overrules Tier 2 overrules Tier 3 on conflicts.
# Usage policy: consult and reference — never copy text or assets into the repo.

register_version: 1

tier_1_authoritative:            # binding for file formats, APIs, product behavior
  - name: Microsoft Learn — Power BI / Fabric documentation
    url: https://learn.microsoft.com/power-bi/
    use_for: "PBIP/PBIR/TMDL formats, feature availability, service behavior"
  - name: PBIR / report definition JSON schemas
    url: https://github.com/microsoft/json-schemas
    use_for: "exact property names and enums — resolve from each file's $schema"
  - name: Microsoft — skills-for-fabric (powerbi-authoring plugin)
    url: https://github.com/microsoft/skills-for-fabric
    use_for: "official agentic authoring skills, Power BI Modeling MCP, Desktop Bridge (ms-authoring adapter); volatile preview surface — re-verify capabilities at use time"
  - name: TMDL documentation
    url: https://learn.microsoft.com/analysis-services/tmdl/tmdl-overview
    use_for: "TMDL syntax and semantics"
  - name: WCAG 2.2
    url: https://www.w3.org/TR/WCAG22/
    use_for: "accessibility criteria (contrast, non-color encoding)"

tier_2_method:                   # binding for method unless Tier 1 contradicts
  - name: Kimball Group — dimensional modeling
    url: https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/
    use_for: "star schema, grain, conformed dimensions"
  - name: SQLBI (DAX Patterns, DAX Guide)
    url: https://www.sqlbi.com/
    use_for: "DAX correctness and patterns; time intelligence"
  - name: Tabular Editor docs & Best Practice Analyzer rules
    url: https://docs.tabulareditor.com/
    use_for: "model hygiene checks and conventions"

tier_3_craft:                    # informing, not binding — design judgment
  - name: Financial Times — Visual Vocabulary
    url: https://github.com/Financial-Times/chart-doctor/tree/main/visual-vocabulary
    use_for: "chart-type selection by analytical intent"
  - name: IBCS standards
    url: https://www.ibcs.com/standards/
    use_for: "notation consistency, variance visualization"
  - name: Storytelling with Data
    url: https://www.storytellingwithdata.com/
    use_for: "decluttering, focus, narrative"
  - name: Nielsen Norman Group
    url: https://www.nngroup.com/
    use_for: "dashboard usability evidence"
  - name: Fluent 2 design system
    url: https://fluent2.microsoft.design/
    use_for: "spacing, type, and component conventions native to the platform"

tier_4_community:                # practitioner blogs - inspiring, verify against Tier 1 before authoring
  # Usage policy: consult and cite, never copy text/specs/assets; techniques
  # are re-derived in this repo's own terms. Maintained by /scout runs.
  - name: bibb.pro
    url: https://bibb.pro/
    use_for: "modern UI patterns (button slicer, navbars, layouts, themes)"
  - name: Valerie Junk (PorcuBI)
    url: https://www.valeriejunk.nl/
    use_for: "tables/matrix craft, storytelling per audience, adoption"
  - name: Kerry Kolosko
    url: https://kerrykolosko.com/
    use_for: "SVG/HTML micro-viz, sparklines, Deneb/SVG templates"
  - name: Deneb guide & community
    url: https://deneb.guide/
    use_for: "Deneb/Vega-Lite capabilities, showcase, versioning"
  - name: Data Pears (Mara Pereira)
    url: https://www.datapears.com/
    use_for: "design-tool-first backgrounds and layout workflow"
  - name: Havens Consulting (Reid Havens)
    url: https://www.havensconsulting.net/
    use_for: "tooltip techniques, report design tricks"
  - name: Data Savvy (Meagan Longoria)
    url: https://datasavvy.me/
    use_for: "Power BI accessibility practice"
  - name: Data Goblins (Kurt Buhler)
    url: https://data-goblins.com/
    use_for: "Power BI design & agentic development practice"
  - name: Siqi Chen — humanizer skill
    url: https://github.com/DogodaBjorn/humanizer
    use_for: "AI-writing-tell detection for user-visible copy (copy-polish)"
  - name: Wikipedia — "Signs of AI writing" (WikiProject AI Cleanup)
    url: https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing
    use_for: "the underlying AI-tell catalog the humanizer skill distills"
  - name: Corey Haines — marketingskills
    url: https://github.com/DogodaBjorn/marketingskills
    use_for: "copy specificity and sweep-based copy editing (copy-polish)"
  - name: Leonxlnx — taste-skill
    url: https://github.com/DogodaBjorn/taste-skill
    use_for: "UI consistency locks (color, shape, page-theme) in design-hard-rules"
  - name: Yonathan Cohen (Tool Monsters) — handoff-skill
    url: https://github.com/DogodaBjorn/handoff-skill
    use_for: "verbatim-state session-handoff format (global handoff skill)"
  - name: Next Level Builder — ui-ux-pro-max skill
    url: https://github.com/DogodaBjorn/ui-ux-pro-max-skill
    use_for: "design-intelligence search tooling and chart/color/typography/style data (design/intelligence, chart-selection.csv, _font-pairings.md)"
  - name: Paul Bakaus — impeccable
    url: https://github.com/DogodaBjorn/impeccable
    use_for: "craft-floor Verify/Refuse discipline and states coverage (design/report-craft-floor.md)"
  - name: Anthropic — skills repo, theme-factory + skill-creator
    url: https://github.com/DogodaBjorn/skills_two
    use_for: "starter theme palettes and the showcase-then-choose pattern (starter brand kits, bk-brand-kit no-brand path); description trigger-eval discipline (skill-forge)"
  - name: Garry Tan — gstack
    url: https://github.com/DogodaBjorn/gstack
    use_for: "scored design review, triage and fix-queue patterns (design-critique); learnings/decisions JSONL memory pattern (scripts/learnings.py)"
  - name: Jesse Vincent — superpowers
    url: https://github.com/obra/superpowers
    use_for: "gate-evidence discipline (lifecycle.md); TDD-for-skills authoring method (skill-forge)"

first_party_internal:            # Bjorn's own repos backported into the template - provenance, not external knowledge
  - name: hp-world-champs (design_handoff_powerbi bundle)
    path: "E:/PowerBI Set-up/hp-world-champs"
    use_for: "origin of the px-prototype pixel-perfect pipeline (MIT, own prior client work)"
  - name: LinkedInContentOps
    path: "E:/TrainerBjornOps/LinkedInContentOps"
    use_for: "origin of the imagery-studio Gemini renderer and imagery-profile pattern (private first-party, no LICENSE file - adopted by ownership)"
  - name: TrainerBjornOps — figma-infographic-design skill
    path: "E:/TrainerBjornOps/.claude/skills/figma-infographic-design"
    use_for: "origin of the fg-figma module's Figma working discipline (content-first, mechanism-mapping, screenshot-per-step, feedback-derived rules)"

project_additions: []            # per-project sources appended at stage 0
